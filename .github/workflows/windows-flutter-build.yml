name: Windows Flutter Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Zip Release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\artifacts | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/artifacts/Windows_Release.zip

      - name: Upload Artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/artifacts/Windows_Release.zip
          if-no-files-found: error